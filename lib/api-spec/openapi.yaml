openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: analytics
    description: Conversion event tracking and metrics
  - name: newsletter
    description: Newsletter subscription via Beehiiv proxy
  - name: admin
    description: Admin-protected variant management and optimization (Bearer token required)
paths:
  /job-posting/analyze:
    post:
      operationId: analyzeJobPosting
      tags: [job-posting]
      summary: Extract evidence-backed screening signals without an account or CV
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JobPostingInput"
      responses:
        "200":
          description: Screening brief grounded in the supplied posting
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobPostingBrief"
        default:
          description: Invalid input, blocked posting, rate limit, or analysis failure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobPostingError"
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /events:
    post:
      operationId: trackEvent
      tags: [analytics]
      summary: Track conversion event
      description: Accepts a conversion event payload from the browser and stores it in SQLite
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConversionEventInput"
      responses:
        "200":
          description: Event recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventAck"
        "400":
          description: Invalid event

  /metrics:
    get:
      operationId: getSiteMetrics
      tags: [analytics]
      summary: Get site-wide metrics
      description: Returns aggregate metrics across all slugs and variants
      responses:
        "200":
          description: Site metrics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SiteMetrics"

  /metrics/{slug}:
    get:
      operationId: getSlugMetrics
      tags: [analytics]
      summary: Get slug-level metrics
      description: Returns conversion metrics for a specific landing page slug
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Slug metrics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SlugMetrics"
        "404":
          description: Slug not found

  /newsletter:
    post:
      operationId: subscribeNewsletter
      tags: [newsletter]
      summary: Subscribe to newsletter via Beehiiv
      description: Server-side proxy to Beehiiv API. Accepts email and segmentation metadata. Never exposes API key to client.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewsletterInput"
      responses:
        "200":
          description: Subscription result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NewsletterResponse"
        "400":
          description: Invalid request

  /admin/metrics:
    get:
      operationId: getAdminMetrics
      tags: [admin]
      summary: Get admin-protected site metrics
      description: Same as /metrics but requires admin Bearer token
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Site metrics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SiteMetrics"
        "401":
          description: Unauthorized

  /admin/optimization-report:
    get:
      operationId: getOptimizationReport
      tags: [admin]
      summary: Get optimization diagnostics per slug
      description: Runs five diagnostics (CVR, scroll depth, engagement, exit intent, high performer) and saves draft recommendations.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Optimization insights and saved recommendations
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OptimizationReport"
        "401":
          description: Unauthorized

  /admin/variants:
    get:
      operationId: listVariants
      tags: [admin]
      summary: List all landing page variants
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Variant list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VariantList"
        "401":
          description: Unauthorized
    post:
      operationId: createVariant
      tags: [admin]
      summary: Create a new landing page variant
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VariantInput"
      responses:
        "201":
          description: Variant created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VariantCreateResponse"
        "400":
          description: Missing required field
        "401":
          description: Unauthorized
        "409":
          description: Slug already exists

  /admin/variants/{id}/activate:
    post:
      operationId: activateVariant
      tags: [admin]
      summary: Activate a variant
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Variant activated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VariantStatusResponse"
        "401":
          description: Unauthorized
        "404":
          description: Variant not found

  /admin/variants/{id}/pause:
    post:
      operationId: pauseVariant
      tags: [admin]
      summary: Pause a variant
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Variant paused
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VariantStatusResponse"
        "401":
          description: Unauthorized
        "404":
          description: Variant not found

  /admin/export/events.csv:
    get:
      operationId: exportEventsCsv
      tags: [admin]
      summary: Export all events as CSV
      security:
        - bearerAuth: []
      responses:
        "200":
          description: CSV file
          content:
            text/csv:
              schema:
                type: string
        "401":
          description: Unauthorized

  /admin/export/metrics.csv:
    get:
      operationId: exportMetricsCsv
      tags: [admin]
      summary: Export slug metrics as CSV
      security:
        - bearerAuth: []
      responses:
        "200":
          description: CSV file
          content:
            text/csv:
              schema:
                type: string
        "401":
          description: Unauthorized

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer

  schemas:
    JobPostingInput:
      type: object
      description: Supply exactly one of url or text. No CV or identity is required.
      properties:
        url:
          type: string
          maxLength: 2000
        text:
          type: string
          minLength: 80
          maxLength: 30000
    JobPostingBrief:
      type: object
      required: [title, company, signals, summary, limitations, sourceType, sourceUrl, analyzedAt]
      properties:
        title:
          type: string
        company:
          type: [string, "null"]
        signals:
          type: array
          minItems: 3
          maxItems: 8
          items:
            type: object
            required: [signal, weight, evidence, interpretation]
            properties:
              signal:
                type: string
              weight:
                type: string
                enum: [high, medium]
              evidence:
                type: string
                description: A verbatim excerpt from the posting
              interpretation:
                type: string
        summary:
          type: string
        limitations:
          type: array
          items:
            type: string
        sourceType:
          type: string
          enum: [url, text]
        sourceUrl:
          type: [string, "null"]
        analyzedAt:
          type: string
          format: date-time
    JobPostingError:
      type: object
      required: [error, code]
      properties:
        error:
          type: string
        code:
          type: string
          enum: [invalid_input, blocked_url, fetch_failed, insufficient_posting, rate_limited, analysis_failed]
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    ConversionEventInput:
      type: object
      required:
        - event_name
        - page_slug
      properties:
        event_name:
          type: string
        timestamp:
          type: ["string", "null"]
        session_id:
          type: ["string", "null"]
        visitor_id:
          type: ["string", "null"]
        page_slug:
          type: string
        experiment_id:
          type: ["string", "null"]
        variant_id:
          type: ["string", "null"]
        traffic_source:
          type: ["string", "null"]
        utm_source:
          type: ["string", "null"]
        utm_medium:
          type: ["string", "null"]
        utm_campaign:
          type: ["string", "null"]
        utm_content:
          type: ["string", "null"]
        utm_term:
          type: ["string", "null"]
        referrer:
          type: ["string", "null"]
        device_type:
          type: ["string", "null"]
        browser:
          type: ["string", "null"]
        conversion_value:
          type: ["number", "null"]
        metadata:
          type: ["object", "null"]
          additionalProperties: true

    EventAck:
      type: object
      required:
        - ok
      properties:
        ok:
          type: boolean

    SlugMetricRow:
      type: object
      properties:
        slug:
          type: string
        page_views:
          type: integer
        unique_visitors:
          type: integer
        free_autopsy_clicks:
          type: integer
        hero_cta_clicks:
          type: integer
        newsletter_signups:
          type: integer
        conversion_rate:
          type: number
        autopsy_rate:
          type: number
        newsletter_rate:
          type: number
        hero_ctr:
          type: number

    VariantMetricRow:
      type: object
      properties:
        variant_id:
          type: string
        experiment_id:
          type: ["string", "null"]
        page_views:
          type: integer
        free_autopsy_clicks:
          type: integer
        hero_cta_clicks:
          type: integer
        newsletter_signups:
          type: integer
        autopsy_rate:
          type: number
        hero_ctr:
          type: number

    SiteMetrics:
      type: object
      properties:
        total_page_views:
          type: integer
        total_unique_visitors:
          type: integer
        total_free_autopsy_clicks:
          type: integer
        total_newsletter_signups:
          type: integer
        overall_conversion_rate:
          type: number
        by_slug:
          type: array
          items:
            $ref: "#/components/schemas/SlugMetricRow"
        top_slug:
          type: ["string", "null"]
        worst_slug:
          type: ["string", "null"]
        top_utm_campaigns:
          type: array
          items:
            type: object
            additionalProperties: true

    SlugMetrics:
      type: object
      properties:
        slug:
          type: string
        page_views:
          type: integer
        unique_visitors:
          type: integer
        free_autopsy_clicks:
          type: integer
        hero_cta_clicks:
          type: integer
        newsletter_signups:
          type: integer
        conversion_rate:
          type: number
        autopsy_rate:
          type: number
        newsletter_rate:
          type: number
        scroll_depth:
          type: object
          additionalProperties: true
        by_variant:
          type: array
          items:
            $ref: "#/components/schemas/VariantMetricRow"
        by_traffic_source:
          type: array
          items:
            type: object
            additionalProperties: true

    NewsletterInput:
      type: object
      required:
        - email
      properties:
        first_name:
          type: ["string", "null"]
          maxLength: 100
        email:
          type: string
          format: email
        page_slug:
          type: ["string", "null"]
        visitor_id:
          type: ["string", "null"]
        experiment_id:
          type: ["string", "null"]
        variant_id:
          type: ["string", "null"]
        beehiiv_segment:
          type: ["string", "null"]
        lead_magnet:
          type: ["string", "null"]
        utm_source:
          type: ["string", "null"]
        utm_medium:
          type: ["string", "null"]
        utm_campaign:
          type: ["string", "null"]
        utm_content:
          type: ["string", "null"]
        utm_term:
          type: ["string", "null"]

    NewsletterResponse:
      type: object
      required:
        - ok
      properties:
        ok:
          type: boolean
        message:
          type: ["string", "null"]

    OptimizationInsight:
      type: object
      properties:
        slug:
          type: string
        views:
          type: integer
        conversions:
          type: integer
        newsletter:
          type: integer
        conversion_rate:
          type: number
        scroll_rate_50pct:
          type: number
        engagement_rate_30s:
          type: number
        exit_intent_rate:
          type: number
        diagnostics:
          type: array
          items:
            type: string

    OptimizationReport:
      type: object
      properties:
        insights:
          type: array
          items:
            $ref: "#/components/schemas/OptimizationInsight"
        saved_recommendations:
          type: array
          items:
            type: object
            additionalProperties: true

    VariantInput:
      type: object
      required:
        - slug
      properties:
        slug:
          type: string
        headline:
          type: ["string", "null"]
        subheadline:
          type: ["string", "null"]
        eyebrow:
          type: ["string", "null"]
        hero_quote:
          type: ["string", "null"]
        cta_primary:
          type: ["string", "null"]
        cta_secondary:
          type: ["string", "null"]
        variant_id:
          type: ["string", "null"]
        experiment_id:
          type: ["string", "null"]

    VariantCreateResponse:
      type: object
      properties:
        id:
          type: integer

    VariantStatusResponse:
      type: object
      properties:
        ok:
          type: boolean
        status:
          type: string

    VariantList:
      type: object
      properties:
        variants:
          type: array
          items:
            type: object
            additionalProperties: true
